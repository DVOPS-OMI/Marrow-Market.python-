{% extends "base.html" %}

{% block title %}Wishlist · Morrow Market{% endblock %}

{% block content %}
<section class="wishlist-page">
  <p class="eyebrow">SAVED FOR LATER</p>
  <h1>Your wishlist<span>.</span></h1>
  <p class="wishlist-intro">The things you’ve had your eye on.</p>

  <div id="wishlist-items" class="wishlist-grid"></div>

  <div id="wishlist-empty" class="wishlist-empty" hidden>
    <span aria-hidden="true">♡</span>
    <h2>Your wishlist is waiting.</h2>
    <p>Tap the heart on a product to save it here.</p>
    <a class="wishlist-shop-link" href="{{ url_for('index') }}">
      Explore the collection →
    </a>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const storageKey = "morrow-market-wishlist";
  const grid = document.querySelector("#wishlist-items");
  const empty = document.querySelector("#wishlist-empty");

  let ids;

  try {
    ids = JSON.parse(localStorage.getItem(storageKey) || "[]");
  } catch {
    ids = [];
  }

  if (!Array.isArray(ids) || ids.length === 0) {
    empty.hidden = false;
    return;
  }

  try {
    const response = await fetch(
      "{{ url_for('wishlist_products') }}?ids=" + encodeURIComponent(ids.join(","))
    );
    if (!response.ok) throw new Error("Could not load wishlist products.");

    const products = await response.json();

    if (!products.length) {
      empty.hidden = false;
      return;
    }

    products.forEach((product) => {
      const card = document.createElement("article");
      card.className = "wishlist-card";

      const image = document.createElement("div");
      image.className = "wishlist-card-image";
      const photo = document.createElement("img");
                    photo.src = product.image;
                    photo.alt = product.name;
                    photo.loading = "lazy";
                    photo.onerror = () => {
                    image.textContent = "♡";
           };
         image.appendChild(photo);

      const details = document.createElement("div");
      details.className = "wishlist-card-details";

      const category = document.createElement("p");
      category.className = "eyebrow";
      category.textContent = product.category || "";

      const name = document.createElement("h2");
      name.textContent = product.name;

      const description = document.createElement("p");
      description.textContent = product.description || "";

      const price = document.createElement("strong");
      price.textContent = product.price;

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "wishlist-remove";
      remove.textContent = "Remove from wishlist";
      remove.addEventListener("click", () => {
        const current = JSON.parse(localStorage.getItem(storageKey) || "[]")
          .map(String)
          .filter((id) => id !== String(product.id));

        localStorage.setItem(storageKey, JSON.stringify(current));
        card.remove();

        if (!grid.children.length) empty.hidden = false;
      });

      details.append(category, name, description, price, remove);
      card.append(image, details);
      grid.appendChild(card);
    });
  } catch (error) {
    empty.hidden = false;
    console.error(error);
  }
});
</script>
{% endblock %}
