{% extends "base.html" %}

{% block title %}Verify sign-in · Morrow Market{% endblock %}

{% block content %}
<section class="otp-page">
  <form class="otp-card" method="post">
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1>Verify your sign-in<span>.</span></h1>
    <p>Enter the six-digit code shown in the Flask terminal.</p>

    <label for="otp">One-time code</label>
    <input
      id="otp"
      name="otp"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      pattern="[0-9]{6}"
      maxlength="6"
      placeholder="000000"
      required
    >

    <button class="button dark otp-submit" type="submit">
      Verify code <span>→</span>
    </button>

    <small>The code expires after five minutes.</small>
  </form>
</section>
{% endblock %}
